<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曼谷設計靈感之旅</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdfaf7; color: #4a4440; line-height: 1.5; }
        .nude-card { background: #ffffff; border-radius: 24px; border: 1px solid #f2e9e1; box-shadow: 0 4px 15px rgba(220, 200, 180, 0.1); }
        .bg-nude-accent { background-color: #e8ddd3; }
        .text-nude-sub { color: #a6968a; }
        .text-soft-gold { color: #b08d66; }
        .border-nude-accent { border-color: #e8ddd3; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 精準字體大小調整 */
        .text-title { font-size: 26px !important; font-weight: 700; }
        .text-location { font-size: 16px !important; font-weight: 700; }
        .text-note { font-size: 13px !important; }
        
        input, textarea, select { font-size: 16px !important; } /* 防止 iOS 縮放 */
        .map-link { cursor: pointer; padding: 2px 6px; border-radius: 6px; background: #fdfaf7; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto min-h-screen p-6 pb-36">
        
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-title tracking-tight text-gray-800 leading-tight">曼谷行程助手</h1>
                <p class="text-[12px] text-nude-sub tracking-widest uppercase text-left">Bangkok Design Notes</p>
            </div>
            <button @click="resetData" class="text-[11px] bg-nude-accent text-white px-3 py-1.5 rounded-full hover:opacity-80 transition">重設資料</button>
        </header>

        <div v-if="currentTab === 'schedule'">
            <nav class="flex gap-2 overflow-x-auto pb-4 mb-4 no-scrollbar text-left">
                <button v-for="(day, index) in itinerary" :key="index"
                    @click="currentDayIndex = index"
                    :class="['px-5 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition-all', 
                    currentDayIndex === index ? 'bg-gray-800 text-white shadow-md scale-105' : 'bg-white text-nude-sub border border-f2e9e1']">
                    Day {{ day.day }}
                </button>
            </nav>

            <main>
                <div v-for="(item, iIndex) in itinerary[currentDayIndex].items" :key="iIndex">
                    <div class="nude-card p-4 relative overflow-hidden mb-1">
                        <div class="flex gap-4">
                            <input v-model="item.time" class="text-location text-gray-800 w-14 outline-none bg-transparent">
                            <div class="flex-1 text-left">
                                <div class="flex items-center justify-between gap-2">
                                    <input v-model="item.location" class="text-location text-gray-900 block w-full outline-none bg-transparent text-left">
                                    <span @click="openMap(item.location)" class="map-link text-sm">📍</span>
                                </div>
                                <input v-model="item.note" class="text-note text-nude-sub block w-full outline-none bg-transparent text-left">
                            </div>
                        </div>
                    </div>
                    <div v-if="iIndex < itinerary[currentDayIndex].items.length - 1" class="ml-9 border-l-2 border-dashed border-nude-accent pl-6 py-4 my-1 flex flex-col gap-1 text-left">
                        <div class="flex items-center gap-2">
                            <input v-model="item.transport.mode" class="text-[11px] bg-nude-accent text-white px-2 py-0.5 rounded-full w-20 outline-none font-bold text-center">
                            <input v-model="item.transport.duration" class="text-[11px] text-nude-sub w-14 outline-none">
                        </div>
                        <input v-model="item.transport.transNote" class="text-note text-soft-gold border-none bg-transparent outline-none italic w-full text-left font-medium" placeholder="輸入交通指引...">
                    </div>
                </div>
            </main>
        </div>

<div v-if="currentTab === 'info'">
            <section class="space-y-5 text-left">
                <div class="nude-card p-6">
                    <h3 class="text-location mb-4 flex items-center gap-2 text-gray-800">🏨 飯店資訊 (For Taxi)</h3>
                    <div class="space-y-4">
                        <div>
                            <p class="text-[11px] text-nude-sub uppercase font-bold tracking-wider">飯店名稱 Hotel Name</p>
                            <input v-model="travelData.hotel.name" class="text-xl w-full bg-transparent outline-none border-b border-nude-accent py-2 font-bold text-gray-900">
                        </div>
                        <div>
                            <p class="text-[11px] text-nude-sub uppercase font-bold tracking-wider">飯店地址 Address</p>
                            <textarea v-model="travelData.hotel.address" class="text-lg leading-relaxed w-full bg-transparent outline-none border-b border-nude-accent py-2 min-h-[110px] resize-none font-bold text-gray-900"></textarea>
                            <button @click="openMap(travelData.hotel.address)" class="text-[11px] text-soft-gold mt-2 underline font-bold">在 Google Maps 開啟</button>
                        </div>
                        <div>
                            <p class="text-[11px] text-nude-sub uppercase font-bold tracking-wider">聯絡電話 Tel</p>
                            <input v-model="travelData.hotel.phone" class="text-xl w-full bg-transparent outline-none border-b border-nude-accent py-2 font-bold text-gray-900">
                        </div>
                    </div>
                </div>

                <div class="nude-card p-5">
                    <h3 class="text-location mb-3 flex items-center gap-2 text-gray-800">✈️ 長榮航空航班</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3 bg-gray-50 rounded-xl border border-f2e9e1">
                            <p class="text-[10px] text-nude-sub mb-1 font-bold">去程 BR067</p>
                            <input v-model="travelData.flight.outbound.time" class="text-xs font-bold w-full bg-transparent outline-none">
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl border border-f2e9e1">
                            <p class="text-[10px] text-nude-sub mb-1 font-bold">回程 BR202</p>
                            <input v-model="travelData.flight.inbound.time" class="text-xs font-bold w-full bg-transparent outline-none">
                        </div>
                    </div>
                </div>

                <div class="nude-card p-5">
                    <h3 class="text-location mb-3 flex items-center gap-2 text-gray-800">🍴 餐廳預約備忘</h3>
                    <textarea v-model="travelData.reservationNote" class="text-note w-full min-h-[120px] bg-gray-50 p-4 rounded-2xl outline-none border-none resize-none shadow-inner font-medium"></textarea>
                </div>

                <div class="nude-card p-5">
                    <h3 class="text-location mb-3 flex items-center gap-2 text-gray-800">🛡️ 保險資訊</h3>
                    <div class="space-y-4">
                        <div class="flex flex-col border-b border-f2e9e1 pb-2">
                            <p class="text-[11px] text-nude-sub uppercase font-bold">保險公司</p>
                            <input v-model="travelData.insurance.company" class="text-sm bg-transparent outline-none font-bold text-gray-800 mt-1">
                        </div>
                        <div class="flex flex-col">
                            <p class="text-[11px] text-nude-sub uppercase font-bold">緊急聯絡電話</p>
                            <input v-model="travelData.insurance.phone" class="text-sm bg-transparent outline-none font-bold text-gray-800 mt-1">
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div v-if="currentTab === 'billing'">
            <div class="space-y-5 text-left">
                <div class="nude-card p-5">
                    <h3 class="text-location mb-3">1. 設定成員</h3>
                    <div class="flex flex-wrap gap-2 mb-3">
                        <span v-for="(name, i) in billingData.members" :key="i" class="bg-nude-accent text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 font-bold">
                            {{ name }} <button @click="billingData.members.splice(i, 1)" class="ml-1 opacity-80">×</button>
                        </span>
                    </div>
                    <div class="flex gap-2">
                        <input v-model="newMember" @keyup.enter="addMember" placeholder="名字" class="flex-1 bg-gray-50 border border-nude-accent rounded-xl px-4 py-2 text-sm outline-none">
                        <button @click="addMember" class="bg-gray-700 text-white px-4 rounded-xl text-lg">+</button>
                    </div>
                </div>
                <div class="nude-card p-5">
                    <h3 class="text-location mb-3">2. 記一筆支出</h3>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <input v-model="newBill.item" placeholder="項目" class="bg-gray-50 border border-nude-accent rounded-xl px-4 py-2 text-sm outline-none">
                        <input v-model.number="newBill.amount" type="number" placeholder="金額" class="bg-gray-50 border border-nude-accent rounded-xl px-4 py-2 text-sm outline-none">
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-nude-sub">誰先付款？</span>
                        <select v-model="newBill.paidBy" class="bg-gray-50 border border-nude-accent rounded-xl px-3 py-1.5 text-xs outline-none font-bold">
                            <option v-for="m in billingData.members" :value="m">{{ m }}</option>
                        </select>
                    </div>
                    <button @click="addBill" class="w-full bg-gray-800 text-white py-3 rounded-xl text-sm font-bold shadow-md">存入支出清單</button>
                </div>
                <div v-if="billingData.history.length" class="nude-card p-5">
                    <h3 class="text-location mb-2 border-b border-nude-accent pb-2">支出紀錄</h3>
                    <div v-for="(b, i) in billingData.history" class="flex justify-between text-sm py-2.5 border-b border-nude-accent last:border-0 font-medium">
                        <span>{{ b.item }} <span class="text-nude-sub text-[11px] ml-1">({{ b.paidBy }})</span></span>
                        <span class="font-bold text-gray-800">${{ b.amount }}</span>
                    </div>
                </div>
            </div>
        </div>

        <footer class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-md bg-gray-800 rounded-[30px] p-1.5 shadow-2xl flex justify-around px-6 py-3 border border-gray-700">
            <button @click="currentTab = 'schedule'" :class="['flex flex-col items-center gap-1 transition', currentTab === 'schedule' ? 'text-white' : 'text-gray-500']">
                <span class="text-lg">🗓️</span><span class="text-[10px] font-bold">行程</span>
            </button>
            <button @click="currentTab = 'info'" :class="['flex flex-col items-center gap-1 transition', currentTab === 'info' ? 'text-white' : 'text-gray-500']">
                <span class="text-lg">📑</span><span class="text-[10px] font-bold">資訊</span>
            </button>
            <button @click="currentTab = 'billing'" :class="['flex flex-col items-center gap-1 transition', currentTab === 'billing' ? 'text-white' : 'text-gray-500']">
                <span class="text-lg">💰</span><span class="text-[10px] font-bold">分帳</span>
            </button>
        </footer>
    </div>

    <script>
        const { createApp, ref, reactive, watch } = Vue;
        
        const initialData = {
            travelData: {
                flight: { airline: '長榮航空 EVA Air', outbound: { code: 'BR067', time: '08:15 - 11:20' }, inbound: { code: 'BR202', time: '15:10 - 20:00' } },
                insurance: { company: '富邦產險', phone: '+886-2-2191-0033' },
                hotel: { 
                    name: 'TRIBE Living Bangkok Sukhumvit 39',
                    address: '📍 39 Soi Phrom Chit, Khlong Tan Nuea, Watthana, Bangkok 10110',
                    phone: '+66 2 662 4333'
                },
                reservationNote: '1. Aunglo by Yangrak (Day 1 18:30)\n2. Peppina (Day 3 19:00)\n3. The Local (Day 6 19:00)'
            },
            itinerary: [
                { day: 1, items: [
                    { time: '11:20', location: '抵達曼谷 BKK 機場', note: '入境辦理', transport: { mode: 'Taxi 🚗', duration: '45m', transNote: '機場 1 樓排班車至飯店約 400-500 銖' } },
                    { time: '15:00', location: 'TRIBE Living 飯店', note: 'Check-in 辦理入住', transport: { mode: 'Taxi 🚗', duration: '30m', transNote: '建議直接叫 Grab 前往餐廳' } },
                    { time: '18:30', location: 'Aunglo by Yangrak', note: '炭火料理晚餐', transport: { mode: 'Taxi 🚗', duration: '20m', transNote: '餐後回飯店休息' } }
                ]},
                { day: 2, items: [
                    { time: '08:30', location: '從 TRIBE 飯店出發', note: '前往碼頭', transport: { mode: 'BTS 🚇', duration: '35m', transNote: '走至 BTS Phrom Phong 搭至 Saphan Taksin 轉觀光船' } },
                    { time: '09:30', location: '鄭王廟泰服體驗', note: '傳統美學拍照', transport: { mode: 'Boat ⛴️', duration: '10m', transNote: '跨河接駁船至 N5 碼頭走 5m' } },
                    { time: '14:00', location: '嵩越路選物', note: '老城設計區', transport: { mode: 'Taxi 🚗', duration: '20m', transNote: '從老城直接叫車回 Sukhumvit 區域' } },
                    { time: '18:00', location: 'Lon Lon Canteen', note: '質感泰式食堂', transport: { mode: 'Walk 🚶', duration: '10m', transNote: '餐後散步回飯店' } }
                ]},
                { day: 3, items: [
                    { time: '10:30', location: '從 TRIBE 飯店出發', note: '前往文創區', transport: { mode: 'Taxi 🚗', duration: '20m', transNote: '建議直接 Grab 至 NEUA.NEUR' } },
                    { time: '11:30', location: 'NEUA.NEUR.BKK', note: '美學空間午餐', transport: { mode: 'Taxi 🚗', duration: '15m', transNote: '移動至倉庫選物店' } },
                    { time: '14:30', location: '倉庫選物店巡禮', note: 'Blue Wild / (un)FASHION', transport: { mode: 'Taxi 🚗', duration: '15m', transNote: '回飯店附近晚餐' } },
                    { time: '19:00', location: 'Peppina', note: '道地披薩晚餐', transport: { mode: 'Walk 🚶', duration: '10m', transNote: '餐後散步回飯店' } }
                ]},
                { day: 4, items: [
                    { time: '08:30', location: '從 TRIBE 飯店出發', note: '包車大城一日遊', transport: { mode: 'Charter 🚗', duration: '1.5h', transNote: '司機已在飯店門口等候' } },
                    { time: '10:30', location: '大城動物園', note: '與長頸鹿互動', transport: { mode: 'Car 🚗', duration: '30m', transNote: '司機接送至景點' } },
                    { time: '14:00', location: '世界遺產參觀', note: '大城古蹟', transport: { mode: 'Car 🚗', duration: '1.5h', transNote: '返回曼谷市區' } },
                    { time: '18:00', location: 'TRIBE 飯店休息', note: '享受飯店設施', transport: { mode: 'Relax 🛀', duration: '-', transNote: '飯店內放空' } }
                ]},
                { day: 5, items: [
                    { time: '08:15', location: '從 TRIBE 飯店出發', note: '前往廚藝學校', transport: { mode: 'BTS 🚇', duration: '25m', transNote: 'BTS Phrom Phong 搭至 Chong Nonsi 3 號出口' } },
                    { time: '09:00', location: 'Silom Cooking School', note: '市場採買與下廚', transport: { mode: 'Walk 🚶', duration: '5m', transNote: '走至附近按摩店' } },
                    { time: '14:00', location: 'Samatha 按摩', note: '精油舒壓', transport: { mode: 'BTS 🚇', duration: '30m', transNote: '搭至 BTS Ari 站 3 號出口' } },
                    { time: '18:00', location: 'Lay Lao 海鮮', note: '米其林推薦', transport: { mode: 'BTS 🚇', duration: '30m', transNote: '搭回 Phrom Phong 回飯店' } }
                ]},
                { day: 6, items: [
                    { time: '09:15', location: '從 TRIBE 飯店出發', note: '前往水果市場', transport: { mode: 'MRT 🚇', duration: '35m', transNote: 'MRT Sukhumvit 站搭至 Kamphaeng Phet' } },
                    { time: '10:00', location: '安多哥市場', note: '生鮮水果採購', transport: { mode: 'Boat ⛴️', duration: '40m', transNote: '搭船或接駁船前往 ICONSIAM' } },
                    { time: '13:00', location: 'ICONSIAM', note: '商場空間設計', transport: { mode: 'Taxi 🚗', duration: '30m', transNote: '前往 Big C 最後採買' } },
                    { time: '16:00', location: 'Big C 伴手禮', note: '最後採買', transport: { mode: 'Taxi 🚗', duration: '20m', transNote: '直接載貨回飯店' } },
                    { time: '19:00', location: 'The Local', note: '傳統泰菜結尾', transport: { mode: 'Walk 🚶', duration: '15m', transNote: '散步回飯店' } }
                ]},
                { day: 7, items: [
                    { time: '09:00', location: 'TRIBE 飯店早餐', note: '最後悠閒', transport: { mode: 'Walk 🚶', duration: '10m', transNote: '飯店周邊最後散步' } },
                    { time: '12:00', location: 'Check-out 出發', note: '前往 BKK 機場', transport: { mode: 'Taxi 🚗', duration: '45m', transNote: '長榮 15:10 起飛，務必 13:10 前抵達' } },
                    { time: '15:10', location: '起飛返台', note: 'BR202 班機', transport: { mode: 'Plane ✈️', duration: '3h 50m', transNote: '預計 20:00 抵達台灣' } }
                ]}
            ],
            billingData: { members: ['我', '朋友A'], history: [] }
        };

        createApp({
            setup() {
                const currentTab = ref('schedule');
                const currentDayIndex = ref(0);
                const travelData = reactive(JSON.parse(JSON.stringify(initialData.travelData)));
                const itinerary = reactive(JSON.parse(JSON.stringify(initialData.itinerary)));
                const billingData = reactive(JSON.parse(JSON.stringify(initialData.billingData)));
                const newMember = ref('');
                const newBill = reactive({ item: '', amount: null, paidBy: '我' });

                const saved = localStorage.getItem('bkk_travel_pro_v5');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.assign(travelData, parsed.travelData);
                    Object.assign(itinerary, parsed.itinerary);
                    Object.assign(billingData, parsed.billingData);
                }

                watch([travelData, itinerary, billingData], () => {
                    localStorage.setItem('bkk_travel_pro_v5', JSON.stringify({ travelData, itinerary, billingData }));
                }, { deep: true });

                const addMember = () => { if (newMember.value) { billingData.members.push(newMember.value); newMember.value = ''; } };
                const addBill = () => { if (newBill.item && newBill.amount) { billingData.history.push({ ...newBill }); newBill.item = ''; newBill.amount = null; } };
                
                const openMap = (location) => {
                    if (!location) return;
                    window.open(`https://www.google.com/maps/search/${encodeURIComponent(location)}`, '_blank');
                };

                const resetData = () => {
                    if (confirm('確定重設？資料將清除！')) {
                        localStorage.removeItem('bkk_travel_pro_v5');
                        location.reload();
                    }
                };

                return { currentTab, currentDayIndex, travelData, itinerary, billingData, newMember, newBill, addMember, addBill, resetData, openMap };
            }
        }).mount('#app');
    </script>
</body>
</html>
