<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>曼谷行程助手 2026</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdfaf7; color: #4a4440; overflow-x: hidden; }
        .nude-card { background: #ffffff; border-radius: 20px; border: 1px solid #f2e9e1; box-shadow: 0 4px 12px rgba(220, 200, 180, 0.08); position: relative; }
        .bg-nude-accent { background-color: #e8ddd3; }
        .text-nude-sub { color: #a6968a; }
        .border-nude-accent { border-color: #e8ddd3; }
        
        /* 拖拽時的樣式 */
        .sortable-ghost { opacity: 0.3; background: #e8ddd3 !important; }
        .drag-handle { cursor: grab; color: #d1c7be; display: flex; align-items: center; padding-right: 8px; }
        
        .text-taxi-info { font-size: 20px !important; font-weight: 700; color: #1a1a1a; }
        input, textarea { font-size: 16px !important; }
        .btn-delete { color: #d1d1d1; font-size: 20px; padding: 4px; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto min-h-screen p-5 pb-32">
        
        <header class="mb-6 flex justify-between items-center">
            <div class="text-left">
                <h1 class="text-2xl font-bold text-gray-800">曼谷行程助手</h1>
                <p class="text-[10px] text-nude-sub tracking-widest uppercase">Bangkok 2026</p>
            </div>
            <button @click="resetData" class="text-[11px] bg-nude-accent text-white px-3 py-1.5 rounded-full">重設</button>
        </header>

        <div v-show="currentTab === 'schedule'">
            <nav class="flex gap-2 overflow-x-auto pb-4 mb-4 no-scrollbar">
                <button v-for="(day, index) in itinerary" :key="index"
                    @click="currentDayIndex = index"
                    :class="['px-5 py-2 rounded-xl text-sm font-bold flex-shrink-0 transition-all', 
                    currentDayIndex === index ? 'bg-gray-800 text-white shadow-md' : 'bg-white text-nude-sub border border-f2e9e1']">
                    Day {{ day.day }}
                </button>
            </nav>

            <div id="itinerary-list">
                <div v-for="(item, iIndex) in itinerary[currentDayIndex].items" :key="item.id" class="item-wrapper">
                    <div class="nude-card p-4 mb-2 flex">
                        <div class="drag-handle">⋮⋮</div>
                        
                        <div class="flex-1 flex gap-3">
                            <input v-model="item.time" class="font-bold text-gray-800 w-12 outline-none bg-transparent">
                            <div class="flex-1 text-left">
                                <div class="flex items-center justify-between">
                                    <input v-model="item.location" class="font-bold text-gray-900 block w-full outline-none bg-transparent">
                                    <button @click="deleteItem(iIndex)" class="btn-delete">×</button>
                                </div>
                                <input v-model="item.note" class="text-xs text-nude-sub block w-full outline-none bg-transparent" placeholder="備註...">
                            </div>
                        </div>
                    </div>

                    <div v-if="iIndex < itinerary[currentDayIndex].items.length - 1" class="ml-10 border-l-2 border-dashed border-nude-accent pl-6 py-3 my-1 flex flex-col gap-1 text-left">
                        <div class="flex items-center gap-2">
                            <input v-model="item.transport.mode" class="text-[10px] bg-nude-accent text-white px-2 py-0.5 rounded-full w-20 text-center outline-none">
                            <input v-model="item.transport.duration" class="text-[10px] text-nude-sub w-14 outline-none">
                        </div>
                        <input v-model="item.transport.transNote" class="text-xs text-stone-400 bg-transparent outline-none italic w-full" placeholder="交通詳情...">
                    </div>
                </div>
            </div>

            <button @click="addItem" class="w-full mt-4 py-4 border-2 border-dashed border-nude-accent rounded-2xl text-nude-sub font-bold text-sm bg-white/50">
                + 新增行程項目 (可長按拖移排序)
            </button>
        </div>

        <div v-show="currentTab === 'info'">
             <div class="nude-card p-6 text-left mb-5">
                <h3 class="font-bold mb-4 text-gray-800">🏨 飯店資訊 (For Taxi)</h3>
                <div class="space-y-4">
                    <div><p class="text-[11px] text-nude-sub font-bold">飯店名稱</p><input v-model="travelData.hotel.name" class="text-taxi-info w-full bg-transparent border-b border-nude-accent py-1 outline-none"></div>
                    <div><p class="text-[11px] text-nude-sub font-bold">飯店地址</p><textarea v-model="travelData.hotel.address" class="text-taxi-info w-full bg-transparent border-b border-nude-accent py-1 outline-none min-h-[100px] resize-none"></textarea></div>
                    <div><p class="text-[11px] text-nude-sub font-bold">電話</p><input v-model="travelData.hotel.phone" class="text-taxi-info w-full bg-transparent border-b border-nude-accent py-1 outline-none"></div>
                </div>
             </div>
             <div class="nude-card p-5 text-left mb-5">
                <h3 class="font-bold mb-3 text-gray-800">✈️ 航班資訊</h3>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div class="p-3 bg-gray-50 rounded-xl">去程: {{ travelData.flight.outbound.time }}</div>
                    <div class="p-3 bg-gray-50 rounded-xl">回程: {{ travelData.flight.inbound.time }}</div>
                </div>
             </div>
        </div>

        <footer class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md bg-gray-900 rounded-[25px] p-2 shadow-2xl flex justify-around">
            <button @click="currentTab = 'schedule'" :class="['flex flex-col items-center p-2', currentTab === 'schedule' ? 'text-white' : 'text-gray-500']"><span>🗓️</span><span class="text-[10px]">行程</span></button>
            <button @click="currentTab = 'info'" :class="['flex flex-col items-center p-2', currentTab === 'info' ? 'text-white' : 'text-gray-500']"><span>📑</span><span class="text-[10px]">資訊</span></button>
        </footer>
    </div>

    <script>
        const { createApp, ref, reactive, watch, onMounted, nextTick } = Vue;
        
        createApp({
            setup() {
                const currentTab = ref('schedule');
                const currentDayIndex = ref(0);
                
                // 預設資料 (已補上每一天飯店出發)
                const defaultItinerary = [1,2,3,4,5,6,7].map(d => ({
                    day: d,
                    items: [
                        { id: Date.now() + Math.random(), time: '09:00', location: '飯店出發', note: 'TRIBE Living', transport: { mode: 'Taxi 🚗', duration: '20m', transNote: '' } }
                    ]
                }));

                const travelData = reactive({
                    hotel: { name: 'TRIBE Living Bangkok Sukhumvit 39', address: '39 Soi Phrom Chit, Bangkok 10110', phone: '+66 2 662 4333' },
                    flight: { outbound: { time: '08:15' }, inbound: { time: '15:10' } }
                });

                const itinerary = reactive(defaultItinerary);

                // 讀取存檔
                const saved = localStorage.getItem('bkk_2026_v7');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    Object.assign(itinerary, parsed.itinerary);
                    Object.assign(travelData, parsed.travelData);
                }

                // 監聽變動存檔
                watch([itinerary, travelData], () => {
                    localStorage.setItem('bkk_2026_v7', JSON.stringify({ itinerary, travelData }));
                }, { deep: true });

                // 拖拽初始化
                const initSortable = () => {
                    const el = document.getElementById('itinerary-list');
                    Sortable.create(el, {
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: (evt) => {
                            const currItems = itinerary[currentDayIndex.value].items;
                            const item = currItems.splice(evt.oldIndex, 1)[0];
                            currItems.splice(evt.newIndex, 0, item);
                        }
                    });
                };

                onMounted(() => { initSortable(); });
                watch(currentDayIndex, () => { nextTick(() => initSortable()); });

                const addItem = () => {
                    itinerary[currentDayIndex.value].items.push({
                        id: Date.now(),
                        time: '12:00',
                        location: '新景點',
                        note: '',
                        transport: { mode: 'Taxi 🚗', duration: '15m', transNote: '' }
                    });
                };

                const deleteItem = (index) => {
                    if(itinerary[currentDayIndex.value].items.length > 1) {
                        itinerary[currentDayIndex.value].items.splice(index, 1);
                    }
                };

                const resetData = () => { if(confirm('重設將清空所有自訂內容？')) { localStorage.removeItem('bkk_2026_v7'); location.reload(); }};

                return { currentTab, currentDayIndex, itinerary, travelData, addItem, deleteItem, resetData };
            }
        }).mount('#app');
    </script>
</body>
</html>
